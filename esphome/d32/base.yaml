# Always-on part: Wi-Fi, API, OTA, logger, BLE proxy. Identical to the original
# lolin-d32-btproxy.yaml, so a base-only build is the already-flashed proxy.
# Override `name` in the top-level file's substitutions.
substitutions:
  name: btproxy-kitchen

esphome:
  name: ${name}

esp32:
  board: lolin_d32
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 300ms

bluetooth_proxy:
  active: true
  cache_services: false
