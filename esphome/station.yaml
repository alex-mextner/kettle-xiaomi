# Workshop station on one ESP32-S3 (N16R8 devkit):
#   1. Bluetooth proxy (active) for HA: Xiaomi kettle yunmi.kettle.v14 (AA:BB:CC:DD:EE:FF,
#      HA integration yunmi_kettle) and BLE scales.
#   2. Spool station (docs/printops/rfid.md §3.3-§3.6): PN532 (SPI), SSD1306 I2C OLED,
#      EC11 encoder + OK/BACK/TARE buttons, HX711 load cell.
#   3. Air sensors: PMS5003 (UART), SGP41 (VOC/NOx), SHT41 (T/RH).
#
# PIN MAP (do not use GPIO26-32 = flash, GPIO33-37 = octal PSRAM on N16R8;
#          avoid GPIO0/3/45/46 = strapping, GPIO19/20 = USB, GPIO43/44 = UART0 console)
#   GPIO12  SPI CLK   -> PN532 SCK
#   GPIO11  SPI MOSI  -> PN532 MOSI
#   GPIO13  SPI MISO  -> PN532 MISO
#   GPIO10  PN532 CS  -> PN532 SS/NSS
#   GPIO8   I2C SDA   -> SSD1306, SGP41, SHT41 (shared bus, addresses 0x3C / 0x59 / 0x44)
#   GPIO9   I2C SCL   -> SSD1306, SGP41, SHT41
#   GPIO4   HX711 DT (DOUT)
#   GPIO5   HX711 SCK
#   GPIO6   EC11 A (CLK)
#   GPIO7   EC11 B (DT)
#   GPIO15  OK button   (the encoder's push switch SW), to GND
#   GPIO16  TARE button, to GND
#   GPIO17  BACK button, to GND
#   GPIO18  UART RX   <- PMS5003 TXD (3.3 V logic; PMS5003 RXD not connected)
#   3V3: PN532, SSD1306, SGP41, SHT41, HX711, encoder.   5V: PMS5003 (fan needs 5 V; ~100 mA).
#   PN532 module must be in SPI mode (DIP switches / solder jumpers per the board's silkscreen).
#
# RISKS
#   - Wi-Fi and BLE share one 2.4 GHz radio/antenna: a long scan window starves Wi-Fi
#     (ESPHome warns above ~300ms), so the scan is 320ms/300ms instead of the old 1100/1100.
#     If the kettle's GATT connection is unreliable or HA reports API drops, tune here.
#   - PMS5003 must have 5 V. Keep its air path away from the heat of the ESP/regulator,
#     and the SHT41 away from them too (self-heating skews T/RH, and SGP41 compensation).
#   - PN532 SPI on ESP32 needs LSB-first SPI (ESPHome handles it in pn532_spi).
#   - POST /v1/tags/scan is NOT implemented in 3d-api yet (rfid.md §3.6 is a proposal);
#     until it exists the request will return an error shown on the display as "ERR <code>".

substitutions:
  station_id: "spool-station-1"
  # 3d-api over Tailscale; alternative on the LAN: http://192.168.x.x:8765
  # Plain HTTP: the bearer token travels unencrypted -- acceptable only inside Tailscale/LAN.
  api_base: "http://<3d-api-host>:8765"

esphome:
  name: ${station_id}
  friendly_name: Workshop Station

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf             # recommended for bluetooth_proxy (stabler BLE)

psram:
  mode: octal                 # N16R8 = octal PSRAM
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none       # recommended for stable BLE proxy + Wi-Fi coexistence

logger:

api:
  encryption:
    key: !secret api_key
  # Needed for homeassistant.event / homeassistant.tag_scanned: in HA enable
  # "Allow the device to perform Home Assistant actions" for this device.

ota:
  - platform: esphome
    password: !secret ota_password

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    active: true

bluetooth_proxy:
  active: true                # allow HA to open GATT connections (kettle control)
  cache_services: false       # the kettle's cached GATT came back empty -> force fresh discovery

globals:
  - id: op_idx                # 0..6 -> load/unload/dry_in/dry_out/store/weigh/note
    type: int
    restore_value: no
    initial_value: '0'
  - id: spool_uid
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: spool_label           # short status/answer line from 3d-api shown on the display
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: tare_raw
    type: float
    restore_value: yes
    initial_value: '0'

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

uart:
  id: uart_pm
  rx_pin: GPIO18
  baud_rate: 9600

http_request:
  timeout: 5s

pn532_spi:
  id: nfc_reader
  cs_pin: GPIO10
  update_interval: 1s
  on_tag:
    then:
      # A touch only SELECTS the spool; the mutation is sent by the OK button (script send_scan).
      - lambda: |-
          id(spool_uid) = x;
          id(spool_label) = "";
      - homeassistant.tag_scanned: !lambda 'return x;'

script:
  - id: send_scan
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(spool_uid).empty();'
          then:
            # POST /v1/tags/scan is a PROPOSAL (rfid.md §3.6 / plan.md §11.1), not yet in 3d-api.
            - http_request.post:
                url: ${api_base}/v1/tags/scan
                capture_response: true
                request_headers:
                  Content-Type: application/json
                  Authorization: !secret printops_station_token_header   # "Bearer <station token>"
                json: !lambda |-
                  static const char *OPS[] = {"load", "unload", "dry_in", "dry_out", "store", "weigh", "note"};
                  root["station"] = "${station_id}";
                  root["uid"] = id(spool_uid);
                  root["op"] = OPS[id(op_idx)];
                  root["weight_g"] = id(scale_g).state;
                  root["nonce"] = str_sprintf("%08x%08x", (unsigned) random_uint32(), (unsigned) millis());
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) id(spool_label) = body.substr(0, 40);
                        else id(spool_label) = "ERR " + to_string(response->status_code);
            - homeassistant.event:
                event: esphome.spool_station
                data:
                  station: ${station_id}
                  uid: !lambda 'return id(spool_uid);'
                  op: !lambda |-
                    static const char *OPS[] = {"load", "unload", "dry_in", "dry_out", "store", "weigh", "note"};
                    return std::string(OPS[id(op_idx)]);

sensor:
  - platform: hx711
    id: scale_raw
    dout_pin: GPIO4
    clk_pin: GPIO5
    gain: 128
    update_interval: 0.5s
    internal: true
  - platform: template
    id: scale_g
    name: "Spool gross weight"
    unit_of_measurement: g
    accuracy_decimals: 0
    update_interval: 0.5s
    # 420.0 = placeholder calibration (raw counts per gram): calibrate with a known weight.
    lambda: 'return (id(scale_raw).state - id(tare_raw)) / 420.0f;'
  - platform: rotary_encoder
    id: enc
    pin_a:
      number: GPIO6
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO7
      mode: INPUT_PULLUP
    internal: true
    on_clockwise:
      - lambda: 'id(op_idx) = (id(op_idx) + 1) % 7;'
    on_anticlockwise:
      - lambda: 'id(op_idx) = (id(op_idx) + 6) % 7;'
  - platform: pmsx003
    type: PMSX003
    uart_id: uart_pm
    pm_1_0:
      name: "PM1.0"
    pm_2_5:
      name: "PM2.5"
    pm_10_0:
      name: "PM10"
  - platform: sht4x
    id: sht41
    address: 0x44
    temperature:
      id: air_temp
      name: "Air temperature"
    humidity:
      id: air_hum
      name: "Air humidity"
    update_interval: 10s
  - platform: sgp4x
    voc_index:
      name: "VOC index"
      id: voc_index
    nox_index:
      name: "NOx index"
      id: nox_index
    compensation:
      humidity_source: air_hum
      temperature_source: air_temp
    update_interval: 1s     # the Sensirion algorithm requires 1 Hz sampling

binary_sensor:
  - platform: gpio            # OK / encoder push: confirm and send
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    name: "OK"
    internal: true
    on_click:
      - script.execute: send_scan
  - platform: gpio            # TARE (empty platform)
    pin:
      number: GPIO16
      mode: INPUT_PULLUP
      inverted: true
    name: "Tare"
    internal: true
    on_click:
      - lambda: 'id(tare_raw) = id(scale_raw).state;'
  - platform: gpio            # BACK / cancel
    pin:
      number: GPIO17
      mode: INPUT_PULLUP
      inverted: true
    name: "Back"
    internal: true
    on_click:
      - lambda: |-
          id(spool_uid) = "";
          id(spool_label) = "";

font:
  - file: "gfonts://Roboto"
    id: f12
    size: 12

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 250ms
    lambda: |-
      static const char *O[] = {"LOAD", "UNLOAD", "DRY IN", "DRY OUT", "STORE", "WEIGH", "NOTE"};
      it.printf(0, 0, id(f12), "Op: %s", O[id(op_idx)]);
      it.printf(0, 16, id(f12), "Tag: %s", id(spool_uid).c_str());
      it.printf(0, 32, id(f12), "%s", id(spool_label).c_str());
      it.printf(0, 48, id(f12), "%.0f g", id(scale_g).state);
