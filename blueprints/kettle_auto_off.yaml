blueprint:
  name: Kettle power pulse at target temperature
  description: >
    Stops a Yunmi kettle at the target temperature with a smart plug. The kettle itself keeps
    heating to 100 C; this automation predicts when the water reaches the target and cuts the plug
    power for a moment (power pulse), which stops the heating. No keep-warm logic. A failsafe cuts
    the plug if the target is not reached in time. Unavailable or unknown sensor values never switch
    the plug. See README.md next to this file.
  domain: automation
  author: kettle-xiaomi
  homeassistant:
    min_version: 2024.10.0
  input:
    water_temperature:
      name: Water temperature sensor
      default: sensor.kettle_water_temperature
      selector:
        entity:
          domain: sensor
    status_sensor:
      name: Kettle status sensor
      default: sensor.kettle_status
      selector:
        entity:
          domain: sensor
    heating_statuses:
      name: Statuses that count as "heating"
      description: >
        Status values (yunmi_kettle enum) at which the kettle is heating towards the target. Only plain
        heating by default.
      default:
        - heating
      selector:
        select:
          multiple: true
          options:
            - standby
            - heating
            - boil_keepwarm
            - heat_to_set
            - cooling
            - abnormal
    switch_entity:
      name: Smart plug
      selector:
        entity:
          domain: switch
    target_temperature:
      name: Target temperature
      default: 75
      selector:
        number:
          min: 40
          max: 100
          step: 1
          unit_of_measurement: "°C"
          mode: box
    target_override:
      name: Target from an entity (optional)
      description: input_number or number entity. When set and numeric it replaces the target temperature above.
      default: ""
      selector:
        entity:
          domain:
            - input_number
            - number
    offset:
      name: Overheat offset
      description: >
        Cut this many degrees BEFORE the target. Covers what the prediction does not know: the sensor
        value is a few seconds old when published and the heater keeps heating after the power is cut.
        Measured on the live kettle (78 -> 82 C after the cut, one run): 3.5 C.
      default: 3.5
      selector:
        number:
          min: -10
          max: 40
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    restore_after_seconds:
      name: Power pulse pause (seconds)
      description: >
        At the target the plug is turned off and after this many seconds on again, so the kettle stops
        heating. 0 = leave the plug off. Not applied after a failsafe cut.
      default: 2
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: s
          mode: box
    max_heating_minutes:
      name: Maximum heating time (failsafe)
      description: >
        Cut the plug (no restore) if it is on, the kettle is heating and the water stays below the
        threshold for this long without the pulse having happened.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: min
          mode: box
    latency_seconds:
      name: Switch-off latency (seconds)
      description: >
        Time from the decision to the plug actually being off. Measured on the live Tuya plug: 1.4 s
        (the timer fires this much earlier).
      default: 1.4
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s
          mode: box
    poll_period_seconds:
      name: Expected time between readings (seconds)
      description: >
        A prediction timer is armed when the threshold is expected sooner than this after a reading.
        With the dynamic poll interval of the patched yunmi_kettle integration readings come every
        6-8 s while heating.
      default: 12
      selector:
        number:
          min: 3
          max: 120
          step: 1
          unit_of_measurement: s
          mode: box
    heat_rate_default:
      name: Default heating rate (C/s)
      description: >
        Start value of the heating rate estimate. Measured on the live kettle: 0.39 C/s (37 -> 78 C in
        105 s, one run, unknown water amount; depends on the volume). Re-estimated from the readings.
      default: 0.39
      selector:
        number:
          min: 0.1
          max: 1.5
          step: 0.01
          mode: box
    heat_rate_entity:
      name: Heating rate helper
      description: input_number helper (C/s) with the running heating rate estimate.
      default: input_number.kettle_heat_rate
      selector:
        entity:
          domain: input_number
    armed_entity:
      name: Cycle flag helper
      description: >
        input_boolean helper. One pulse per heating: the flag goes off with the pulse (or when the plug
        goes off) and is set again ONLY by a cycle start: plug off -> on after a real off period, or the
        kettle status changing from a non-heating status to heating. Never by temperature.
      default: input_boolean.kettle_heat_armed
      selector:
        entity:
          domain: input_boolean
    failsafe_flag_entity:
      name: Failsafe tripped flag helper
      description: >
        input_boolean helper set when the failsafe cuts the plug. The "Kettle plug keep on" blueprint
        does not switch the plug back on while it is set.
      default: input_boolean.kettle_failsafe_tripped
      selector:
        entity:
          domain: input_boolean
    notify_service:
      name: Notify service (optional)
      description: Full service name, for example notify.mobile_app_phone. Empty = no push notification.
      default: ""
      selector:
        text:
    persistent_notification:
      name: Create persistent notification
      default: true
      selector:
        boolean:

mode: parallel
max: 10
max_exceeded: silent

trigger_variables:
  water_sensor: !input water_temperature
  status_sensor: !input status_sensor
  heating_statuses: !input heating_statuses
  target_temperature: !input target_temperature
  target_override: !input target_override
  offset: !input offset
  plug: !input switch_entity
  armed_entity: !input armed_entity

variables:
  water_sensor: !input water_temperature
  status_sensor: !input status_sensor
  heating_statuses: !input heating_statuses
  target_temperature: !input target_temperature
  target_override: !input target_override
  offset: !input offset
  plug: !input switch_entity
  armed_entity: !input armed_entity
  rate_entity: !input heat_rate_entity
  heat_rate_default: !input heat_rate_default
  latency_s: !input latency_seconds
  poll_period: !input poll_period_seconds
  max_minutes: !input max_heating_minutes
  restore_after: !input restore_after_seconds
  notify_service: !input notify_service
  use_persistent: !input persistent_notification

triggers:
  # Safety net: fires on the false -> true edge of "reading >= threshold" (edge = no repeats while the
  # water stays hot). The prediction below normally acts earlier. Non-numeric readings are false.
  - trigger: template
    id: target_reached
    value_template: >-
      {% set tgt = target_temperature | float(75) %}
      {% if target_override and is_number(states(target_override)) %}
        {% set tgt = states(target_override) | float %}
      {% endif %}
      {% set cur = states(water_sensor) %}
      {{ is_number(cur) and (cur | float) >= tgt - (offset | float(0)) }}
  # Failsafe: plug on, kettle heating (status), below the threshold, continuously for N minutes.
  - trigger: template
    id: failsafe
    value_template: >-
      {% set tgt = target_temperature | float(75) %}
      {% if target_override and is_number(states(target_override)) %}
        {% set tgt = states(target_override) | float %}
      {% endif %}
      {% set cur = states(water_sensor) %}
      {{ is_state(plug, 'on') and states(status_sensor) in heating_statuses
         and is_number(cur) and (cur | float) < tgt - (offset | float(0)) }}
    for:
      minutes: !input max_heating_minutes
  # Every new numeric water temperature reading: rate estimate and the prediction timer.
  - trigger: state
    id: temp_update
    entity_id: !input water_temperature
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
  - trigger: state
    id: plug_off
    entity_id: !input switch_entity
    to: "off"
  # Cycle start transitions (re-arm and rate reset): plug off -> on, status change.
  - trigger: state
    id: plug_on
    entity_id: !input switch_entity
    from: "off"
    to: "on"
  - trigger: state
    id: status_change
    entity_id: !input status_sensor

actions:
  - variables:
      target_now: >-
        {% set tgt = target_temperature | float(75) %}
        {% if target_override and is_number(states(target_override)) %}
          {% set tgt = states(target_override) | float %}
        {% endif %}
        {{ tgt }}
      temp_now: "{{ states(water_sensor) }}"
  - choose:
      # Safety net pulse: the reading is already at/over the threshold.
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'target_reached' }}"
        sequence:
          - condition: template
            value_template: >-
              {{ is_state(plug, 'on') and states(status_sensor) in heating_statuses
                 and is_state(armed_entity, 'on') }}
          - variables:
              restore: true
              title: Kettle ready
              message: >-
                Kettle reached {{ temp_now }} °C (target {{ target_now }} °C, offset {{ offset }} °C),
                power pulse: plug off{{ ', on again in ' ~ restore_after ~ ' s' if (restore_after | float(0)) > 0 }}.
          - &cut
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: !input switch_entity
              - action: input_boolean.turn_off
                target:
                  entity_id: !input armed_entity
              - parallel:
                  - if:
                      - condition: template
                        value_template: "{{ use_persistent }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "{{ title }}"
                          message: "{{ message }}"
                  - if:
                      - condition: template
                        value_template: "{{ notify_service | length > 0 }}"
                    then:
                      - action: "{{ notify_service }}"
                        data:
                          title: "{{ title }}"
                          message: "{{ message }}"
              - if:
                  - condition: template
                    value_template: "{{ restore and (restore_after | float(0)) > 0 }}"
                then:
                  - delay:
                      seconds: "{{ restore_after | float(0) | round(0) | int }}"
                  # Only if nobody switched it in the meantime.
                  - condition: template
                    value_template: "{{ is_state(plug, 'off') }}"
                  - action: switch.turn_on
                    target:
                      entity_id: !input switch_entity
      # Prediction: every new reading during a heating updates the heating rate (average of the last
      # readings, noise-guarded) and the time to the threshold. If that is sooner than the next reading
      # (poll_period_seconds), a timer does the pulse, minus the measured switch-off latency. The timer
      # is cancelled by the next reading (which re-estimates), a status change, plug off or flag off.
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'temp_update' }}"
        sequence:
          - condition: template
            value_template: >-
              {{ is_state(plug, 'on') and states(status_sensor) in heating_statuses
                 and is_number(trigger.to_state.state) and is_number(trigger.from_state.state) }}
          # The cycle flag must be on: it is set only by the cycle start transitions (see below).
          - condition: template
            value_template: "{{ is_state(armed_entity, 'on') }}"
          - variables:
              dt: "{{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() }}"
              rate_old: "{{ states(rate_entity) | float(heat_rate_default | float(0.39)) }}"
          - variables:
              inst: >-
                {{ (((trigger.to_state.state | float) - (trigger.from_state.state | float)) / dt) if dt > 0 else 0 }}
          - variables:
              inst_ok: "{{ dt >= 2 and dt <= 90 and inst >= 0.05 and inst <= 1.5 }}"
          # Noise guard: one reading moves the estimate by at most -30%/+40% of the old value.
          - variables:
              inst_c: "{{ [[inst, 0.7 * rate_old] | max, 1.4 * rate_old] | min }}"
          - variables:
              rate: >-
                {{ [[((0.5 * rate_old + 0.5 * inst_c) if inst_ok else rate_old), 0.1] | max, 1.5] | min }}
          - if:
              - condition: template
                value_template: "{{ inst_ok }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: !input heat_rate_entity
                data:
                  value: "{{ rate | round(3) }}"
          - variables:
              t_total: >-
                {{ ((target_now | float(0)) - (offset | float(0)) - (trigger.to_state.state | float)) / rate }}
              age: "{{ (now() - trigger.to_state.last_changed).total_seconds() }}"
          - variables:
              delay_s: "{{ [t_total - (latency_s | float(1.4)) - age, 0.05] | max }}"
          # Only when the threshold is reached before the next reading is due.
          - condition: template
            value_template: "{{ t_total > 0 and t_total <= (poll_period | float(12)) }}"
          - wait_for_trigger:
              - trigger: state
                entity_id: !input water_temperature
              - trigger: state
                entity_id: !input status_sensor
              - trigger: state
                entity_id: !input switch_entity
                to: "off"
              - trigger: state
                entity_id: !input armed_entity
                to: "off"
            timeout: "{{ delay_s | round(2) }}"
            continue_on_timeout: true
          - condition: template
            value_template: >-
              {{ wait.trigger is none and is_state(plug, 'on')
                 and states(status_sensor) in heating_statuses and is_state(armed_entity, 'on') }}
          - variables:
              restore: true
              title: Kettle ready (predicted)
              message: >-
                Predicted target: reading {{ trigger.to_state.state }} °C, rate {{ rate | round(2) }} °C/s,
                pulse {{ delay_s | round(1) }} s after the reading (target {{ target_now }} °C, offset {{ offset }} °C).
                Plug off{{ ', on again in ' ~ restore_after ~ ' s' if (restore_after | float(0)) > 0 }}.
          - *cut
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'failsafe' }}"
        sequence:
          - condition: template
            value_template: "{{ is_state(plug, 'on') }}"
          - variables:
              restore: false
              title: Kettle failsafe
              message: >-
                Failsafe: kettle was heating for {{ max_minutes }} min without reaching the target;
                plug turned off and not restored. Water {{ temp_now }} °C, target {{ target_now }} °C.
          # Remember the intentional cut: "Kettle plug keep on" leaves the plug off until the flag is
          # cleared (plug switched on by hand, or the helper switched off).
          - action: input_boolean.turn_on
            target:
              entity_id: !input failsafe_flag_entity
          - *cut
      # Plug went off for any reason (including the pulse): the cycle is over.
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'plug_off' }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input armed_entity
      # A new cycle starts (and only here the cycle flag is set again, never by temperature):
      #  - plug off -> on after a real off period (the power pulse restores the plug within
      #    restore_after_seconds plus the cloud latency, which is shorter than the limit below), or
      #  - the kettle status changes from a non-heating status to heating.
      # The heating rate estimate restarts from the default.
      - conditions:
          - condition: template
            value_template: >-
              {{ (trigger.id == 'plug_on' and trigger.from_state is not none
                  and (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds()
                      > (restore_after | float(0)) + 20)
                 or (trigger.id == 'status_change' and trigger.from_state is not none
                     and trigger.to_state.state in heating_statuses
                     and trigger.from_state.state not in heating_statuses
                     and trigger.from_state.state not in ['unavailable', 'unknown']) }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input armed_entity
          - action: input_number.set_value
            target:
              entity_id: !input heat_rate_entity
            data:
              value: "{{ heat_rate_default | float(0.39) }}"
